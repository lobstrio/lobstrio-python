name: regenerate

# Regenerates src/lobstrio/_generated.py from the live OpenAPI (https://api.lobstr.io/v2/openapi.json) every day. When it changed
# (new operations, options, fields or wording) and the lint and the tests pass on it, it releases it: a minor version
# when operations were added, a patch otherwise (scripts/release_after_regenerate.py writes the version and the
# CHANGELOG), committed to the default branch and tagged with the release deploy key (secret RELEASE_DEPLOY_KEY,
# allowed past the branch's protection); the tag starts release.yml, which publishes. A new operation of the API
# reaches the SDK's users the next morning, typed.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}   # pushes and tags as the release key: its tag starts release.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ".[dev]"
      - name: Generate from the live OpenAPI
        run: python scripts/generate.py
      - name: Did it change?
        id: diff
        run: |
          if git diff --quiet -- src/lobstrio/_generated.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/lobstrio/_generated.py
          fi
      - name: Lint and test the new output
        if: steps.diff.outputs.changed == 'true'
        run: ruff check . && pytest
      - name: Release it
        if: steps.diff.outputs.changed == 'true'
        run: |
          version="$(python3 scripts/release_after_regenerate.py)"
          git config user.name "lobstr.io"
          git config user.email "contact@lobstr.io"
          git commit -qam "Regenerate from the live OpenAPI: v$version"
          git tag "v$version"
          git push origin HEAD:${{ github.event.repository.default_branch }} "v$version"
          echo "Released v$version: release.yml publishes it."
