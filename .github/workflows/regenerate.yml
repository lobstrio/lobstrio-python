name: regenerate

# Regenerates src/lobstrio/_generated.py from the live OpenAPI (https://api.lobstr.io/v2/openapi.json)
# every day, and opens a pull request when it changed: new operations, options or fields. The
# repository must allow GitHub Actions to create pull requests (Settings > Actions > General >
# Workflow permissions). A pull request opened with GITHUB_TOKEN starts no workflow of its own: the
# lint and the tests run here, before it is opened.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: regenerate/openapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ".[dev]"
      - name: Generate from the live OpenAPI
        run: python scripts/generate.py
      - name: Did it change?
        id: diff
        run: |
          if git diff --quiet -- src/lobstrio/_generated.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/lobstrio/_generated.py
          fi
      - name: Lint and test the new output
        if: steps.diff.outputs.changed == 'true'
        run: ruff check . && pytest
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/lobstrio/_generated.py
          git commit -m "Regenerate from the live OpenAPI"
          git push --force origin "$BRANCH"
          open="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')"
          if [ -z "$open" ]; then
            {
              echo "\`python scripts/generate.py\` from https://api.lobstr.io/v2/openapi.json changed \`src/lobstrio/_generated.py\`; lint and unit tests pass on it."
              echo
              echo '```'
              git diff --stat HEAD~1 -- src/lobstrio/_generated.py
              echo '```'
            } > body.md
            gh pr create --head "$BRANCH" --base "$BASE" --title "Regenerate from the live OpenAPI" --body-file body.md
          else
            echo "Pull request #$open updated."
          fi
